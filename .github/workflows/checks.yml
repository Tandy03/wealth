name: Code and contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node backend/scripts/prepareTestConfig.js
      - run: npm run lint
      - run: npm run check:frontend
      - run: npm test
      # Deployments, generated secrets and APK builds are explicitly outside CI.
